
@if (showIp) {
  <div class="ip">{{ip}}</div>
}
<small>
  @if (lat && lng) {
    <a [href]="'https://www.google.com/maps/search/?api=1&query=' + lat + '%2C' + lng" target="_blank">
      <ng-container *ngTemplateOutlet="countryTmpl"></ng-container>
    </a>
  } @else {
    <fs-country
      [code]="country"
      [region]="region"
      [matTooltip]="ip"
      [matTooltipDisabled]="showIp">
    </fs-country>
  }
</small>

<ng-template #countryTmpl>
  <fs-country
    [code]="country"
    [region]="region"
    [matTooltip]="ip"
    [matTooltipDisabled]="showIp">
  </fs-country>
</ng-template>
